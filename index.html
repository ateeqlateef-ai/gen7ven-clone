  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            novexa: {
              bg: '#FFFFFF',
              section: '#F5FAFF',
              lightBlue: '#E0F2FE',
              sky: '#0EA5E9',
              blue: '#2563EB',
              blueHover: '#1D4ED8',
              heading: '#0F172A',
              body: '#475569',
              muted: '#64748B',
              border: '#E2E8F0',
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', '-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', 'sans-serif'],
            display: ['"Space Grotesk"', '"Plus Jakarta Sans"', 'sans-serif'],
          }
        }
      }
    };

  <style>
    :root {
      color-scheme: light;
      --bg-primary: #FFFFFF;
      --bg-section: #F5FAFF;
      --border-color: #E2E8F0;
      --primary-blue: #2563EB;
      --primary-sky: #0EA5E9;
    }

    body { 
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #FFFFFF;
      color: #475569;
      overflow-x: hidden;
      margin: 0;
      padding: 0;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ==========================================================================
       TEXT SELECTION ENGINE FIX (ROOT CAUSE RESOLUTION):
       Prevents multi-line overlap, vertical clipping, or background layer collision.
       Ensures crisp, readable selection styling site-wide.
       ========================================================================== */
    ::selection {
      background-color: #BFDBFE !important;
      color: #0F172A !important;
      text-shadow: none !important;
    }
    ::-moz-selection {
      background-color: #BFDBFE !important;
      color: #0F172A !important;
      text-shadow: none !important;
    }

    /* Ensure any text-clip or gradient text resets properly on selection */
    [class*="bg-clip-text"]::selection,
    .text-gradient::selection,
    h1::selection,
    h2::selection,
    h3::selection,
    h4::selection,
    p::selection,
    span::selection,
    a::selection {
      -webkit-text-fill-color: #0F172A !important;
      background-color: #BFDBFE !important;
      text-shadow: none !important;
    }

    /* Clean Light Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 7px;
    }
    ::-webkit-scrollbar-track {
      background: #F8FAFC;
    }
    ::-webkit-scrollbar-thumb {
      background: #CBD5E1;
      border-radius: 8px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94A3B8;
    }

    /* Typography Hierarchy & Contrast */
    h1, h2, h3, h4, h5, h6 {
      font-family: 'Space Grotesk', 'Plus Jakarta Sans', sans-serif;
      color: #0F172A;
      letter-spacing: -0.025em;
    }

    /* Subtle Modern Sky/Blue Gradient Text for Selective Highlights */
    .text-accent-gradient {
      background: linear-gradient(135deg, #0284C7 0%, #2563EB 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: inline;
    }

    /* Subtle Clean Light Grid Pattern */
    .bg-grid-light {
      background-size: 32px 32px;
      background-image: 
        linear-gradient(to right, rgba(14, 165, 233, 0.05) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(14, 165, 233, 0.05) 1px, transparent 1px);
    }
  </style>
</head>
<body class="bg-white text-slate-600 antialiased selection:bg-[#BFDBFE] selection:text-[#0F172A]">
