    body {

      background-color: #07090e;
      color: #94a3b8;
      overflow-x: hidden;

    /* ==========================================================================
       TEXT SELECTION ENGINE FIX:
       Prevents multi-line overlap, clipping, or transparent text collisions.
       Ensures translucent high-contrast highlight across all elements.
       ========================================================================== */
    ::selection {
      background-color: rgba(37, 99, 235, 0.38) !important;
      color: #ffffff !important;
      text-shadow: none !important;
    }
    ::-moz-selection {
      background-color: rgba(37, 99, 235, 0.38) !important;
      color: #ffffff !important;
      text-shadow: none !important;
    }

    /* Fix selection on gradient/clipped text elements */
    [class*="bg-clip-text"]::selection,
    .text-gradient::selection,
    h1::selection,
    h2::selection,
    h3::selection,
    span::selection {
      -webkit-text-fill-color: #ffffff !important;
      background-color: rgba(37, 99, 235, 0.42) !important;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 7px;
    }
    ::-webkit-scrollbar-track {
      background: #07090e;
    }
    ::-webkit-scrollbar-thumb {
      background: #1e293b;
      border-radius: 8px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #2563eb;
    }

    /* Typography Hierarchy & Contrast */
    h1, h2, h3, h4 {
      font-family: 'Space Grotesk', 'Plus Jakarta Sans', sans-serif;
      color: #f8fafc;
      letter-spacing: -0.025em;
    }

    /* Controlled, Elegant Accent Text */
    .text-accent-gradient {
      background: linear-gradient(135deg, #38bdf8 0%, #2563eb 50%, #60a5fa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: inline;
    }

    /* Subtle Architectural Grid Background */
    .bg-grid-pattern {
      background-size: 40px 40px;
      background-image: 
        linear-gradient(to right, rgba(30, 41, 59, 0.3) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(30, 41, 59, 0.3) 1px, transparent 1px);
    }
